name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - build/unsigned-ipa
      - main
    paths:
      - .github/workflows/build-unsigned-ipa.yml
      - scripts/package-unsigned-ipa.sh
      - scripts/juice-release-delta.py
      - scripts/restore-tracked-symlinks.sh
      - releases/**
      - Makefile

permissions:
  contents: read

jobs:
  verify:
    name: Source verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Restore tracked symlinks
        run: bash scripts/restore-tracked-symlinks.sh
      - name: Install verify tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Verify source tree
        run: make verify

  unsigned-ipa:
    name: Package unsigned IPA
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Restore tracked symlinks
        run: bash scripts/restore-tracked-symlinks.sh
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd zip unzip python3
      - name: Build unsigned tipa and ipa
        run: make unsigned-ipa
      - name: Upload unsigned IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Juice-unsigned-ipa
          path: |
            dist/Juice-*-unsigned.ipa
            dist/Juice-*-unsigned.ipa.sha256
            dist/Juice-*-unsigned.tipa
            dist/Juice-*-unsigned.tipa.sha256
          if-no-files-found: error
          retention-days: 30
