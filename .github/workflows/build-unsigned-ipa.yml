name: Repackage legacy release delta

# Manual only. This rebuilds the old RC1+delta TIPA and does NOT include
# current source/runtime fixes. Use "Build from source (Linux)" instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Source verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Restore tracked symlinks
        run: bash scripts/restore-tracked-symlinks.sh
      - name: Install verify tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Verify source tree
        run: make verify

  legacy-tipa:
    name: Package legacy delta TIPA
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Ensure Git LFS payloads
        run: |
          git lfs install --local
          git lfs pull --include="releases/*"
          ls -lh releases/*.tipa releases/*delta.tar.zst
      - name: Restore tracked symlinks
        run: bash scripts/restore-tracked-symlinks.sh
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd zip unzip python3
      - name: Free space before packaging
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - name: Build legacy delta tipa
        run: make unsigned-ipa
      - name: Upload legacy TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Juice-legacy-delta-tipa
          path: |
            dist/Juice-*-unsigned.tipa
            dist/Juice-*-unsigned.tipa.sha256
          if-no-files-found: error
          retention-days: 7
