name: Build from source (Linux)

# Full Wine/iOS cross-compile producing a TIPA with the current source tree.
# This is the only CI path that includes runtime fixes from the repository.

on:
  workflow_dispatch:
    inputs:
      require_win32:
        description: "Build WoW64/Win32 modules (JUICE_REQUIRE_WIN32)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
  push:
    branches:
      - main
      - build/unsigned-ipa
    paths:
      - config/runtime-modules.txt
      - scripts/**
      - wine/**
      - app/**
      - launcher/**
      - toolchain/**
      - Makefile
      - .github/workflows/build-from-source.yml

permissions:
  contents: read

concurrency:
  group: juice-from-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-x64:
    name: make linux-x86_64-x64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Restore tracked symlinks
        run: bash scripts/restore-tracked-symlinks.sh

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld cmake git python3 bison flex m4 curl file rsync \
            zip unzip xz-utils tar pkg-config autoconf automake libtool nasm \
            libssl-dev libxml2-dev zlib1g-dev zstd

      - name: Cache build deps and toolchains
        uses: actions/cache@v4
        with:
          path: |
            build/deps
            build/ios-toolchain
            build/wine-tools-linux
          key: juice-linux-deps-${{ hashFiles('config/runtime-modules.txt', 'config/**/*.env', 'scripts/fetch-*.sh', 'scripts/bootstrap-*.sh') }}
          restore-keys: |
            juice-linux-deps-

      - name: Full Juice build
        env:
          JUICE_REQUIRE_WIN32: ${{ github.event_name == 'workflow_dispatch' && inputs.require_win32 || '1' }}
          JUICE_RECONFIGURE: 1
          JUICE_TIPA_OUTPUT: ${{ github.workspace }}/dist/Juice-FromSource-unsigned.tipa
        run: |
          mkdir -p dist
          make linux-x86_64-x64
          (cd dist && sha256sum Juice-FromSource-unsigned.tipa > Juice-FromSource-unsigned.tipa.sha256)
          unzip -t dist/Juice-FromSource-unsigned.tipa >/dev/null
          ls -lh dist/

      - name: Upload from-source TIPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Juice-from-source-unsigned
          path: |
            dist/Juice-FromSource-unsigned.tipa
            dist/Juice-FromSource-unsigned.tipa.sha256
          if-no-files-found: error
          retention-days: 14
